<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Report | WCI Engine</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <style>
        .layout { margin-left: 240px; padding: 36px 40px 56px; min-height: 100vh; }
        .report-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 24px; }
        .report-header h1 { font-size: 1.75rem; margin-bottom: 6px; }
        .muted { color: var(--text-secondary); }
        .report-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
        .stack { display: flex; flex-direction: column; gap: 20px; }
        .summary-card { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 14px; }
        .metric-card { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 0 12px 32px rgba(30, 27, 75, 0.06); }
        .metric-label { color: var(--text-secondary); font-size: 0.74rem; text-transform: uppercase; font-weight: 800; letter-spacing: 0.05em; margin-bottom: 10px; }
        .metric-value { font-family: 'JetBrains Mono', monospace; font-size: 1.45rem; font-weight: 800; }
        .report-card { background: white; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 32px rgba(30, 27, 75, 0.06); overflow: hidden; }
        .card-head { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 14px; }
        .card-body { padding: 20px; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .status-pill { display: inline-flex; align-items: center; padding: 7px 11px; border-radius: 999px; font-weight: 800; font-size: 0.76rem; }
        .status-clean { color: var(--success); background: rgba(16,185,129,0.1); }
        .status-flagged { color: var(--danger); background: rgba(239,68,68,0.1); }
        .bar-row { margin-bottom: 16px; }
        .bar-meta { display: flex; justify-content: space-between; gap: 16px; font-size: 0.82rem; margin-bottom: 7px; }
        .question-list { display: flex; flex-direction: column; gap: 12px; }
        .question-item { border: 1px solid var(--border); border-radius: 12px; padding: 15px; background: #FBFAFF; }
        .question-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
        .question-text { font-weight: 700; line-height: 1.45; }
        .question-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .insight-list { display: flex; flex-direction: column; gap: 12px; }
        .insight-item { padding: 16px; border-radius: 12px; background: #FBFAFF; border: 1px solid var(--border); color: var(--text-secondary); line-height: 1.5; }
        .insight-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
        .insight-title strong { color: var(--text-primary); font-size: 0.98rem; }
        .priority-pill { display: inline-flex; padding: 5px 9px; border-radius: 999px; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; }
        .priority-high { color: var(--danger); background: rgba(239,68,68,0.1); }
        .priority-medium { color: var(--warning); background: rgba(245,158,11,0.12); }
        .priority-low { color: var(--success); background: rgba(16,185,129,0.1); }
        .insight-line { margin-top: 7px; }
        .insight-line span { color: var(--text-primary); font-weight: 700; }
        .resource-link { display: inline-flex; margin-top: 12px; color: var(--accent-primary); text-decoration: none; font-weight: 800; font-size: 0.82rem; }
        .violation-item { padding: 12px; border-radius: 10px; border: 1px solid rgba(239,68,68,0.22); background: rgba(239,68,68,0.06); color: #991B1B; margin-bottom: 10px; line-height: 1.45; }
        .empty-note { color: var(--text-secondary); text-align: center; padding: 24px; }
        .loader-wrap { min-height: 360px; display: grid; place-items: center; }

        @media (max-width: 1100px) {
            .report-grid { grid-template-columns: 1fr; }
            .summary-card { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
        }
        @media (max-width: 900px) {
            .layout { margin-left: 0; padding: 24px 16px; }
            .report-header { flex-direction: column; }
            .summary-card { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <aside id="sidebar"></aside>

    <main class="layout">
        <header class="report-header">
            <div>
                <h1 id="candidate-name">Candidate Report</h1>
                <p class="muted" id="report-subtitle">Loading interview details...</p>
                <div class="tag-list" id="skills-tested" style="margin-top: 12px;"></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-secondary" onclick="window.location.href='reports.html'">Back to Reports</button>
                <button class="btn btn-primary" onclick="window.print()">Download PDF</button>
            </div>
        </header>

        <div id="loader" class="loader-wrap">
            <div class="loading-spinner" style="width: 48px; height: 48px;"></div>
        </div>

        <section id="report-content" style="display: none;">
            <div class="summary-card" style="margin-bottom: 24px;">
                <div class="metric-card">
                    <div class="metric-label">Overall Score</div>
                    <div class="metric-value" id="overall-score">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Credibility</div>
                    <div class="metric-value" id="credibility-score">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Session Type</div>
                    <div class="metric-value" id="session-type" style="font-size: 1rem;">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Integrity</div>
                    <div id="integrity-status">--</div>
                </div>
            </div>

            <div class="report-grid">
                <div class="stack">
                    <div class="report-card">
                        <div class="card-head">
                            <h3>Question Breakdown</h3>
                            <span class="muted" id="question-count">0 questions</span>
                        </div>
                        <div class="card-body">
                            <div class="question-list" id="question-list"></div>
                        </div>
                    </div>

                    <div class="report-card">
                        <div class="card-head">
                            <h3>AI Recommendations</h3>
                        </div>
                        <div class="card-body">
                            <div class="insight-list" id="recommendations-list"></div>
                        </div>
                    </div>
                </div>

                <aside class="stack">
                    <div class="report-card">
                        <div class="card-head">
                            <h3>Candidate Details</h3>
                        </div>
                        <div class="card-body">
                            <div class="bar-row">
                                <div class="metric-label">Job Role</div>
                                <strong id="job-role">--</strong>
                            </div>
                            <div class="bar-row">
                                <div class="metric-label">Report Date</div>
                                <strong id="report-date">--</strong>
                            </div>
                            <div class="bar-row">
                                <div class="metric-label">Report ID</div>
                                <span class="mono" id="report-id" style="font-size: 0.8rem; word-break: break-all;">--</span>
                            </div>
                        </div>
                    </div>

                    <div class="report-card">
                        <div class="card-head">
                            <h3>Score Breakdown</h3>
                        </div>
                        <div class="card-body" id="breakdown-bars"></div>
                    </div>

                    <div class="report-card">
                        <div class="card-head">
                            <h3>Behavior Signals</h3>
                        </div>
                        <div class="card-body" id="behavior-bars"></div>
                    </div>

                    <div class="report-card">
                        <div class="card-head">
                            <h3>Proctoring Flags</h3>
                        </div>
                        <div class="card-body" id="violation-list"></div>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const reportId = new URLSearchParams(window.location.search).get('report_id');
            if (!reportId) {
                showError('No report selected.');
                return;
            }

            try {
                const report = await apiRequest(`/report/${reportId}`);
                renderReport(report);
            } catch (err) {
                showError(err.message || 'Unable to load report.');
            }
        });

        function renderReport(report) {
            const flags = Array.isArray(report.shortcut_flags) ? report.shortcut_flags : [];
            const skills = Array.isArray(report.skills_tested) ? report.skills_tested : [];
            const questions = Array.isArray(report.question_results) ? report.question_results : [];

            document.getElementById('candidate-name').textContent = report.name || 'Candidate Report';
            document.getElementById('report-subtitle').textContent = `${report.job_role || 'Software Engineer'} assessment completed on ${report.date || '--'}`;
            document.getElementById('overall-score').textContent = `${report.overall_score ?? 0}%`;
            document.getElementById('credibility-score').textContent = `${report.credibility_score ?? 0}%`;
            document.getElementById('session-type').textContent = titleCase(report.session_type || 'interview');
            document.getElementById('job-role').textContent = report.job_role || 'Software Engineer';
            document.getElementById('report-date').textContent = report.date || '--';
            document.getElementById('report-id').textContent = report.report_id || '--';
            document.getElementById('question-count').textContent = `${questions.length} question${questions.length === 1 ? '' : 's'}`;

            document.getElementById('integrity-status').innerHTML = flags.length
                ? `<span class="status-pill status-flagged">${flags.length} Flag${flags.length === 1 ? '' : 's'}</span>`
                : '<span class="status-pill status-clean">Clean</span>';

            document.getElementById('skills-tested').innerHTML = skills.length
                ? skills.map(skill => `<span class="tag">${skill}</span>`).join('')
                : '<span class="tag">No skills listed</span>';

            renderBars('breakdown-bars', report.score_breakdown || {});
            renderBars('behavior-bars', report.behavioral_signals || {});
            renderQuestions(questions);
            renderRecommendations(report.recommendations);
            renderFlags(flags);

            document.getElementById('loader').style.display = 'none';
            document.getElementById('report-content').style.display = 'block';
        }

        function renderBars(containerId, data) {
            const entries = Object.entries(data || {});
            const container = document.getElementById(containerId);
            if (!entries.length) {
                container.innerHTML = '<div class="empty-note">No data available.</div>';
                return;
            }
            container.innerHTML = entries.map(([label, value]) => {
                const score = Math.max(0, Math.min(100, Number(value) || 0));
                return `
                    <div class="bar-row">
                        <div class="bar-meta">
                            <strong>${titleCase(label.replace(/_/g, ' '))}</strong>
                            <span class="mono">${score}%</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${score}%"></div></div>
                    </div>
                `;
            }).join('');
        }

        function renderQuestions(questions) {
            const container = document.getElementById('question-list');
            if (!questions.length) {
                container.innerHTML = '<div class="empty-note">No question details available.</div>';
                return;
            }
            container.innerHTML = questions.map((q, index) => {
                const score = q.score ?? q.ai_score ?? 0;
                const flag = q.shortcut_flag || q.shortcut_reason;
                return `
                    <article class="question-item">
                        <div class="question-top">
                            <span class="tag">Question ${index + 1}</span>
                            <strong class="mono">${score}%</strong>
                        </div>
                        <div class="question-text">${q.text || q.question || 'Technical interview question'}</div>
                        <div class="question-meta">
                            <span class="tag">${titleCase(q.difficulty || 'medium')}</span>
                            <span class="tag">${q.skill || 'General'}</span>
                            <span class="tag">${q.time_taken || q.time || '--'} time</span>
                            ${flag ? '<span class="status-pill status-flagged">Flagged</span>' : '<span class="status-pill status-clean">Clean</span>'}
                        </div>
                        ${q.answer ? `<p class="muted" style="margin-top: 12px; line-height: 1.5;">${q.answer}</p>` : ''}
                    </article>
                `;
            }).join('');
        }

        function renderRecommendations(recommendations) {
            const container = document.getElementById('recommendations-list');
            const items = normalizeList(recommendations);
            container.innerHTML = items.length
                ? items.map(formatRecommendation).join('')
                : '<div class="empty-note">No recommendations available.</div>';
        }

        function renderFlags(flags) {
            const container = document.getElementById('violation-list');
            container.innerHTML = flags.length
                ? flags.map(flag => `<div class="violation-item">${flag}</div>`).join('')
                : '<div class="empty-note">No proctoring flags recorded.</div>';
        }

        function normalizeList(value) {
            if (Array.isArray(value)) return value;
            if (value && typeof value === 'object') return Object.values(value).flat();
            return [];
        }

        function formatRecommendation(value) {
            if (typeof value === 'string') {
                return `<div class="insight-item">${escapeHtml(value)}</div>`;
            }

            if (value && typeof value === 'object') {
                const area = value.area || value.skill || value.title || 'Recommendation';
                const problem = value.problem || value.issue || value.gap || '';
                const suggestion = value.suggestion || value.recommendation || value.message || value.text || '';
                const priority = String(value.priority || 'medium').toLowerCase();
                const resourceUrl = value.resource_url || value.resource || value.url || '';
                const priorityClass = priority === 'high' ? 'priority-high' : priority === 'low' ? 'priority-low' : 'priority-medium';

                return `
                    <article class="insight-item">
                        <div class="insight-title">
                            <strong>${escapeHtml(area)}</strong>
                            <span class="priority-pill ${priorityClass}">${escapeHtml(priority)} priority</span>
                        </div>
                        ${problem ? `<div class="insight-line"><span>Gap:</span> ${escapeHtml(problem)}</div>` : ''}
                        ${suggestion ? `<div class="insight-line"><span>Suggestion:</span> ${escapeHtml(suggestion)}</div>` : ''}
                        ${resourceUrl ? `<a class="resource-link" href="${escapeAttribute(resourceUrl)}" target="_blank" rel="noopener">Open learning resource</a>` : ''}
                    </article>
                `;
            }

            return `<div class="insight-item">${escapeHtml(String(value))}</div>`;
        }

        function showError(message) {
            document.getElementById('loader').innerHTML = `<div class="report-card"><div class="card-body"><strong>Unable to load report.</strong><p class="muted" style="margin-top: 8px;">${message}</p></div></div>`;
        }

        function titleCase(value) {
            return String(value).replace(/\w\S*/g, word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase());
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function escapeAttribute(value) {
            return escapeHtml(value).replace(/`/g, '&#96;');
        }
    </script>
</body>
</html>
