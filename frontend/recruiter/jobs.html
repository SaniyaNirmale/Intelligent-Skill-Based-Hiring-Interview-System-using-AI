<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Job Roles | WCI Engine</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <style>
        body {
            background-color: #080710;
            color: #f4f4f5;
        }

        .layout {
            margin-left: 240px;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 32px;
            transition: margin-left 0.3s;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 24px;
        }

        .page-title h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .page-title p {
            color: #a1a1aa;
            font-size: 0.95rem;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            margin-top: 16px;
        }

        /* Glassmorphic Job Card Style */
        .job-card {
            background: rgba(25, 20, 40, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            min-height: 280px;
        }

        .job-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #a78bfa, #7c3aed);
            opacity: 0.85;
        }

        .job-card:hover {
            transform: translateY(-4px);
            border-color: rgba(167, 139, 250, 0.3);
            box-shadow: 0 12px 40px rgba(167, 139, 250, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            gap: 12px;
        }

        .job-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
        }

        .difficulty-indicator {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .diff-easy { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .diff-medium { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .diff-hard { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

        .job-description {
            font-size: 0.85rem;
            color: #d1d5db;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }

        .skill-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e4e4e7;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .card-metadata {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            gap: 12px;
        }

        .btn-delete {
            width: 100%;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            cursor: pointer;
            text-align: center;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #ffffff;
        }

        /* Modal Overlay Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(8, 7, 16, 0.85);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-card {
            background: #120e24;
            border: 1px solid rgba(167, 139, 250, 0.25);
            width: 90%;
            max-width: 540px;
            padding: 36px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            color: #ffffff;
            position: relative;
            transform: scale(0.95);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-card.show {
            transform: scale(1);
            opacity: 1;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: #a1a1aa;
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: #ffffff;
        }

        .modal-title {
            color: #a78bfa;
            font-size: 1.5rem;
            margin-bottom: 24px;
            font-weight: 800;
        }

        /* Form styling */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: rgba(167, 139, 250, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(167, 139, 250, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 14px;
            font-weight: 700;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
            text-align: center;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 14px;
            font-weight: 700;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .empty-jobs-card {
            background: rgba(25, 20, 40, 0.2);
            backdrop-filter: blur(12px);
            border: 1px dashed rgba(255, 255, 255, 0.10);
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            max-width: 500px;
            margin: 40px auto;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <!-- Sidebar Placeholder -->
    <aside id="sidebar">
        <!-- Sidebar placeholder -->
    </aside>

    <main class="layout">
        <header class="header-section">
            <div class="page-title">
                <h1>💼 Manage Job Openings</h1>
                <p>Register official roles, outline skill descriptions, and establish proctored assessment requirements.</p>
            </div>
            <button class="btn btn-primary" style="background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%); border: none; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);" onclick="showCreateModal()">
                + Create Job Role
            </button>
        </header>

        <div id="jobs-container" class="jobs-grid">
            <div class="loading-spinner" style="grid-column: 1 / -1; margin: 40px auto;"></div>
        </div>
    </main>

    <!-- Create Job Modal -->
    <div id="job-modal" class="modal-overlay">
        <div class="modal-card" id="job-modal-card">
            <button class="modal-close" onclick="closeCreateModal()">&times;</button>
            <h2 class="modal-title">Create New Job Opening</h2>
            
            <form id="create-job-form" onsubmit="handleCreateJob(event)">
                <div class="form-group">
                    <label class="form-label" for="job-title">Job Title</label>
                    <input class="form-input" type="text" id="job-title" placeholder="e.g. Backend Developer" required />
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="job-desc">Job Description</label>
                    <textarea class="form-input" id="job-desc" rows="3" placeholder="Describe the core duties and responsibilities of the role..." style="resize: none;" required></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="job-skills">Required Skills (Comma separated)</label>
                    <input class="form-input" type="text" id="job-skills" placeholder="e.g. Python, FastAPI, SQL" required />
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="job-diff">Difficulty</label>
                        <select class="form-input" id="job-diff" style="background-color: #120e24;">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="job-q-count">Total Questions</label>
                        <input class="form-input" type="number" id="job-q-count" value="10" min="5" max="25" required />
                    </div>
                </div>
                
                <div class="card-actions" style="margin-top: 32px;">
                    <button type="button" class="btn-cancel" style="flex: 1;" onclick="closeCreateModal()">Cancel</button>
                    <button type="submit" class="btn-submit" style="flex: 1;">Create Role</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        let jobRoles = [];

        window.addEventListener('load', async () => {
            const user = JSON.parse(sessionStorage.getItem('wci_user'));
            if (!user || user.role !== 'recruiter') {
                window.location.href = '../login-recruiter.html';
                return;
            }
            await fetchJobRoles();
        });

        async function fetchJobRoles() {
            const container = document.getElementById('jobs-container');
            try {
                const data = await apiRequest('/recruiter/job-roles', 'GET');
                jobRoles = data;
                renderJobsList();
            } catch (err) {
                console.error("Failed to fetch jobs:", err);
                container.innerHTML = `<div style="color:var(--danger); grid-column:1/-1; text-align:center;">Failed to load job registry. ${err.message}</div>`;
            }
        }

        function renderJobsList() {
            const container = document.getElementById('jobs-container');
            if (jobRoles.length === 0) {
                container.innerHTML = `
                    <div class="empty-jobs-card" style="grid-column: 1 / -1;">
                        <span style="font-size: 3rem; margin-bottom: 16px; display: block;">💼</span>
                        <h3>No Job Roles Added</h3>
                        <p>Create a job role listing to enable all logged-in students to analyze and self-initiate official evaluations.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = jobRoles.map(job => {
                const diffClass = `diff-${job.difficulty || 'medium'}`;
                const diffLabel = (job.difficulty || 'Medium').charAt(0).toUpperCase() + (job.difficulty || 'Medium').slice(1);
                
                const skillPills = (job.skills || []).map(s => `<span class="skill-pill">${s}</span>`).join(' ');

                return `
                    <div class="job-card" id="card-${job.role_id}">
                        <div>
                            <div class="card-header">
                                <span class="job-title">${job.title}</span>
                                <span class="difficulty-indicator ${diffClass}">${diffLabel}</span>
                            </div>
                            <p class="job-description">${job.description || 'No description provided.'}</p>
                            <div class="skills-container">${skillPills}</div>
                        </div>
                        
                        <div>
                            <div class="card-metadata">
                                <div class="meta-item">
                                    <span>📋</span>
                                    <span>${job.num_questions || 10} Questions</span>
                                </div>
                                <div class="meta-item">
                                    <span>🛡️</span>
                                    <span>Secure Proctoring</span>
                                </div>
                            </div>
                            
                            <div class="card-actions">
                                <button class="btn-delete" onclick="handleDeleteRole('${job.role_id}')">Delete Role Listing</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showCreateModal() {
            const modal = document.getElementById('job-modal');
            const card = document.getElementById('job-modal-card');
            
            modal.style.display = 'flex';
            setTimeout(() => {
                card.classList.add('show');
            }, 50);
        }

        function closeCreateModal() {
            const card = document.getElementById('job-modal-card');
            card.classList.remove('show');
            setTimeout(() => {
                document.getElementById('job-modal').style.display = 'none';
                document.getElementById('create-job-form').reset();
            }, 300);
        }

        async function handleCreateJob(e) {
            e.preventDefault();
            
            const title = document.getElementById('job-title').value.trim();
            const description = document.getElementById('job-desc').value.trim();
            const skills = document.getElementById('job-skills').value.trim();
            const difficulty = document.getElementById('job-diff').value;
            const numQuestions = document.getElementById('job-q-count').value;
            
            try {
                const response = await apiRequest('/recruiter/create-job', 'POST', {
                    title,
                    description,
                    skills,
                    difficulty,
                    num_questions: numQuestions
                });
                
                jobRoles.push(response);
                renderJobsList();
                closeCreateModal();
            } catch (err) {
                alert("Failed to create job opening: " + err.message);
            }
        }

        async function handleDeleteRole(roleId) {
            if (!confirm("Are you sure you want to delete this job role? Logged-in candidates will no longer be able to initiate assessments for it.")) {
                return;
            }
            
            try {
                await apiRequest(`/recruiter/job-role/${roleId}`, 'DELETE');
                jobRoles = jobRoles.filter(j => j.role_id !== roleId);
                renderJobsList();
            } catch (err) {
                alert("Failed to delete job role: " + err.message);
            }
        }
    </script>
</body>
</html>
