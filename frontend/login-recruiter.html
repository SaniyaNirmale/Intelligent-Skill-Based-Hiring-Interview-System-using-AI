<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Login | WCI Engine</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body {
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.1);
        }
        .input-group {
            position: relative;
            margin-bottom: 24px;
        }
        .input-group input {
            width: 100%;
            padding: 16px;
            padding-top: 24px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
        }
        .input-group label {
            position: absolute;
            left: 16px;
            top: 18px;
            color: var(--text-secondary);
            transition: var(--transition);
            pointer-events: none;
        }
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 8px;
            font-size: 0.75rem;
            color: var(--accent-primary);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="margin-bottom: 8px;">Recruiter Login</h2>
        <p style="color: var(--text-secondary); margin-bottom: 32px;">Access the recruitment dashboard.</p>

        <form id="loginForm" onsubmit="handleLogin(event, 'recruiter')">
            <div class="input-group">
                <input type="email" name="email" placeholder=" " required>
                <label>Email Address</label>
            </div>
            <div class="input-group">
                <input type="password" name="password" id="password" placeholder=" " required>
                <label>Password</label>
                <button type="button" onclick="togglePassword('password')" style="position: absolute; right: 16px; top: 18px; border: none; background: none; color: var(--text-secondary); cursor: pointer;">Show</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--text-secondary); cursor: pointer;">
                    <input type="checkbox" style="width: 16px; height: 16px; accent-color: var(--accent-primary);"> Remember Me
                </label>
            </div>

            <div id="error-message" class="error-message" style="display: none; margin-bottom: 16px;"></div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; margin-bottom: 16px;">Sign In</button>
        </form>

        <p style="text-align: center; font-size: 0.9rem;">
            <a href="index.html" style="color: var(--text-secondary); text-decoration: none;">&larr; Back to main login</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
